name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -W clippy::all

      - name: Run Tests
        run: cargo test --release --locked

      - name: Build (Release)
        run: cargo build --release --locked

      - name: Stage build output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./publish -Force | Out-Null
          Copy-Item .\target\release\InvenAdClicker.exe .\publish\InvenAdClicker.exe
          Copy-Item .\config.json.example .\publish\config.json.example

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./publish/**
