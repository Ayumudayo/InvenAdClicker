name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore InvenAdClicker.sln

      - name: Build
        run: dotnet build InvenAdClicker.sln --configuration Release --no-restore

      - name: Run Tests with Code Coverage
        shell: pwsh
        run: |
          dotnet test tests/InvenAdClicker.Tests/InvenAdClicker.Tests.csproj `
            --no-build `
            --configuration Release `
            --verbosity normal `
            --results-directory ./artifacts/test-results `
            --logger "trx;LogFileName=tests.trx" `
            --collect:"XPlat Code Coverage"

      - name: Summarize coverage
        if: always()
        shell: pwsh
        run: ./scripts/summarize-coverage.ps1 -ResultsDirectory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results

      - name: Publish (Release)
        run: dotnet publish InvenAdClicker.csproj -c Release -r win-x64 -o ./publish

      - name: Verify published app and install matching Chromium
        shell: pwsh
        run: ./scripts/verify-publish.ps1 -PublishDirectory ./publish -InstallChromium

      - uses: actions/upload-artifact@v4
        with:
          name: publish-output
          path: ./publish/**
          include-hidden-files: true
