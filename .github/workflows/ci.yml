name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore InvenAdClicker.sln

      - name: Build
        run: dotnet build InvenAdClicker.sln --configuration Release --no-restore

      - name: Install Playwright Chromium (if needed)
        shell: pwsh
        run: |
          $playwrightPs = "bin/Release/net8.0/playwright.ps1"
          if (Test-Path $playwrightPs) {
            pwsh $playwrightPs install chromium
          }

      - name: Run Tests with Code Coverage
        shell: pwsh
        run: |
          dotnet test tests/InvenAdClicker.Tests/InvenAdClicker.Tests.csproj `
            --no-build `
            --configuration Release `
            --verbosity normal `
            --collect:"XPlat Code Coverage"

      - name: Publish (Release)
        run: dotnet publish InvenAdClicker.sln -c Release -o ./publish --no-build --no-restore

      - uses: actions/upload-artifact@v4
        with:
          name: publish-output
          path: ./publish/**
