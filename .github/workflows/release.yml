name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    if: github.event.deleted == false
    runs-on: windows-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish InvenAdClicker.csproj -c Release -r win-x64 -o ./publish /p:Version=${{ env.VERSION }}

      - name: Verify published app and install matching Chromium
        shell: pwsh
        run: ./scripts/verify-publish.ps1 -PublishDirectory ./publish -InstallChromium

      - name: Copy README and LICENSE into publish folder
        shell: pwsh
        run: |
          Copy-Item README.md .\publish\README.md
          Copy-Item LICENSE .\publish\LICENSE

      - name: Zip Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          $zipPath = Join-Path (Resolve-Path ./artifacts) "InvenAdClicker-${{ env.VERSION }}.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path ./publish).Path, $zipPath)

      - name: Generate Checksums
        shell: pwsh
        run: |
          $zipPath = ".\artifacts\InvenAdClicker-${{ env.VERSION }}.zip"
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$hash  InvenAdClicker-${{ env.VERSION }}.zip" | Out-File -Encoding utf8 .\artifacts\checksums.txt
          Write-Host "SHA256: $hash"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: |
            ./artifacts/InvenAdClicker-${{ env.VERSION }}.zip
            ./artifacts/checksums.txt
          generateReleaseNotes: true
