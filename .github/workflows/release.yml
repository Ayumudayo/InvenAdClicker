name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and upload assets (e.g., v6.1.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release-please
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.tag != '') || (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 1
          fetch-tags: false

      - name: Resolve Version
        shell: pwsh
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          "VERSION=$version" | Add-Content -Path $env:GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Clippy & Test
        run: |
          cargo clippy --all-targets --locked -- -W clippy::all
          cargo test --release --locked

      - name: Build (Release)
        run: cargo build --release --locked

      - name: Stage Release Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./publish -Force | Out-Null
          Copy-Item .\target\release\InvenAdClicker.exe .\publish\InvenAdClicker.exe
          Copy-Item .\config.json.example .\publish\config.json.example
          Copy-Item .\README.md .\publish\README.md
          Copy-Item .\LICENSE .\publish\LICENSE

      - name: Zip Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          $zipPath = Join-Path (Resolve-Path ./artifacts) "InvenAdClicker-${{ env.VERSION }}.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path ./publish).Path, $zipPath)

      - name: Generate Checksums
        shell: pwsh
        run: |
          $zipPath = ".\artifacts\InvenAdClicker-${{ env.VERSION }}.zip"
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$hash  InvenAdClicker-${{ env.VERSION }}.zip" | Out-File -Encoding utf8 .\artifacts\checksums.txt
          Write-Host "SHA256: $hash"

      - name: Upload Release Assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:TAG_NAME" `
            "./artifacts/InvenAdClicker-${{ env.VERSION }}.zip" `
            "./artifacts/checksums.txt" `
            --clobber
