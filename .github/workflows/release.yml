name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    if: github.event.deleted == false
    runs-on: windows-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clippy & Test
        run: |
          cargo clippy --all-targets --locked -- -W clippy::all
          cargo test --release --locked

      - name: Build (Release)
        run: cargo build --release --locked

      - name: Stage Release Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./publish -Force | Out-Null
          Copy-Item .\target\release\InvenAdClicker.exe .\publish\InvenAdClicker.exe
          Copy-Item .\config.json.example .\publish\config.json.example
          Copy-Item .\README.md .\publish\README.md
          Copy-Item .\LICENSE .\publish\LICENSE

      - name: Zip Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          $zipPath = Join-Path (Resolve-Path ./artifacts) "InvenAdClicker-${{ env.VERSION }}.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path ./publish).Path, $zipPath)

      - name: Generate Checksums
        shell: pwsh
        run: |
          $zipPath = ".\artifacts\InvenAdClicker-${{ env.VERSION }}.zip"
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$hash  InvenAdClicker-${{ env.VERSION }}.zip" | Out-File -Encoding utf8 .\artifacts\checksums.txt
          Write-Host "SHA256: $hash"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: |
            ./artifacts/InvenAdClicker-${{ env.VERSION }}.zip
            ./artifacts/checksums.txt
          generateReleaseNotes: true
