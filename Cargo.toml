[package]
name = "inven-ad-clicker"
version = "6.0.0"
edition = "2021"

[[bin]]
name = "InvenAdClicker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
hex = "0.4"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "native-tls", "charset"] }
rand = "0.8"
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rpassword = "7"
unicode-width = "0.2"
unicode-segmentation = "1"
tempfile = "3"
scraper = { version = "0.29.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

